services:
  - type: web
    name: bible-quiz-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: false
    healthCheckPath: /health
    dockerCommand: sh -c "npx prisma migrate deploy && node dist/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false

