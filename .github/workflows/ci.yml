name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  quality:
    name: Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build --workspace=@bible-quiz/shared-types --workspace=@bible-quiz/shared-validation

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Typecheck workspaces
        run: npm run typecheck --workspaces --if-present

      - name: Lint Admin Web
        run: npm --prefix apps/admin run lint

      - name: Run API tests
        run: npm --prefix apps/api test

      - name: Build API & Admin Web
        run: |
          npm --prefix apps/api run build
          npm --prefix apps/admin run build

