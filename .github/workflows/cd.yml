name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build --workspace=@bible-quiz/shared-types --workspace=@bible-quiz/shared-validation

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Typecheck workspaces
        run: npm run typecheck --workspaces --if-present

      - name: Lint Admin Web
        run: npm --prefix apps/admin run lint

      - name: Run API tests
        run: npm --prefix apps/api test

      - name: Build API & Admin Web
        run: |
          npm --prefix apps/api run build
          npm --prefix apps/admin run build

  deploy:
    name: Trigger Render & Vercel Deploys
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render API deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK_URL não configurado. Pulando deploy da API no Render."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy da API no Render acionado com sucesso."

      - name: Trigger Vercel Admin deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning::Secret VERCEL_DEPLOY_HOOK_URL não configurado. Pulando deploy do Admin na Vercel."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy do Admin Web na Vercel acionado com sucesso."

